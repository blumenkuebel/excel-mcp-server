services:
  excel-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.http
    image: excel-mcp-server:latest
    container_name: excel-mcp-server
    ports:
      - "8002:8002"
    volumes:
      - /mnt/dockershare/excel:/app/excel_files
    environment:
      EXCEL_FILES_PATH: /app/excel_files
      FASTMCP_HOST: "0.0.0.0"
      FASTMCP_PORT: "8002"
      MCP_API_KEY: "bd59182beac12da16f09014681cc72730ee27adb4b4a83f0142c1818ae0e2844"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, urllib.error;\ntry: urllib.request.urlopen('http://localhost:8002/mcp')\nexcept urllib.error.HTTPError as e: exit(0 if e.code==406 else 1)\nexcept: exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
